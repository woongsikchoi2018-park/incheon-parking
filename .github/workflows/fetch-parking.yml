name: 주차 데이터 갱신

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  fetch-parking:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 공공데이터 API 호출
        run: |
          curl -sf \
            "https://apis.data.go.kr/B551177/StatusOfParking/getTrackingParking?serviceKey=0a14146eb3792c2431da885ae66255e06cb942e10e85ddd953de019de7af777d&numOfRows=100&pageNo=1&type=json" \
            -o docs/parking.json

      - name: Git 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/parking.json
          git diff --staged --quiet || git commit -m "주차 데이터 갱신"
          git push
