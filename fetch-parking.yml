name: 주차 데이터 갱신

on:
  schedule:
    - cron: '*/5 * * * *'   # 5분마다 실행 (GitHub Actions 최소 단위)
  workflow_dispatch:          # 수동 실행 버튼

jobs:
  fetch-parking:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 공공데이터 API 호출
        run: |
          curl -s "https://apis.data.go.kr/B551177/StatusOfParking/getTrackingParking?serviceKey=0a14146eb3792c2431da885ae66255e06cb942e10e85ddd953de019de7af777d&numOfRows=100&pageNo=1&type=json" \
            -o docs/parking.json
          echo "데이터 갱신 완료: $(date '+%Y-%m-%d %H:%M:%S KST' -d '+9 hours')"
          cat docs/parking.json | head -c 200

      - name: Git 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/parking.json
          git diff --staged --quiet || git commit -m "주차 데이터 갱신 $(date '+%H:%M KST' -d '+9 hours')"
          git push
